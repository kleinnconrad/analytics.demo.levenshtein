name: Auto Approve Dependabot PRs

# "pull_request" instead of "pull_request_target": the workflow does not need access to
# repository secrets. For Dependabot PRs, the permissions below grant the token write
# access to pull requests.
on: pull_request

permissions:
  pull-requests: write

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    # Check the PR author instead of github.actor: the actor is the user who triggered the
    # event, e.g. someone who pushed a commit to the Dependabot branch.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Approve pull request
        run: gh pr review --approve --body "Auto-approved Dependabot PR" "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
