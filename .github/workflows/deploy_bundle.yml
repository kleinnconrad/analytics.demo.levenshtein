name: Deploy Databricks Asset Bundle

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'data_generation/**'
      - 'data/**'
      - 'tests/**'
      - 'resources/**'
      - 'databricks.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/deploy_bundle.yml'

jobs:
  test_and_lint:
    name: Run Tests and Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        # --locked fails if uv.lock does not match pyproject.toml
        run: uv sync --locked

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check formatting with ruff
        run: uv run ruff format --check .

      - name: Run unit tests with pytest
        run: uv run pytest

  validate_and_deploy:
    name: Validate and Deploy Bundle
    needs: test_and_lint # Deploy only if tests and linting pass
    # Pull requests are tested but never deployed
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: "https://dbc-91e4a242-418c.cloud.databricks.com"
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@v1.20.0

      - name: Validate Databricks Bundle
        run: databricks bundle validate

      - name: Deploy Databricks Bundle
        run: databricks bundle deploy -t default
